<html>
    <head>
        <title>OddEven</title>
        <link rel="stylesheet" type="text/css" href="/home/user/amana/s1 mca/web devolopment/style.css">
    </head>
        <body>
            <center>
            <h2>CHECK ODD OR EVEN</h2>
            <label>enter a number</label>
            <input type="number" id="num" >
            <button onclick="checkoddeven()">Check</button>
            <p id="result"></p>
            <script>
                function checkoddeven()
                {
                    let number= document.getElementById("num").value;
                    number=Number(number);
                
                if(isNaN(number))
                {
                    document.getElementById("result").innerText="please enter a number!";

                } else if (number % 2===0)
                {
                    document.getElementById("result").innerText= number +" is Even!";
                }
                else
                {
                    document.getElementById("result");
                    alert("odd!");

                }
                
            }
            </script>
        </center>
        </body>
    
</html>
