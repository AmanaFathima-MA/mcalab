<html>
    <head>
        <title>Registration Form</title>
        <link rel="stylesheet" type="text/css" href="/home/user/amana/s1 mca/web devolopment/style.css">
        
        <script>
            function validateform()
            {
                let name= document.forms["regForm"]["name"].value;
                let email= document.forms["regForm"]["email"].value;
                let phone= document.forms["regForm"]["phone"].value;
                let password= document.forms["regForm"]["password"].value;
                let conpassword= document.forms["regForm"]["conpassword"].value;
                if(name=="")
                {
                    alert('name must be filled out');
                    return false;
                }
                if(email=="")
                {
                    alert('email must be filled out');
                    return false;
                }
                if(phone=="")
                {
                    alert('phone must be filled out');
                    return false;
                }
                let emailpattern=/^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
                if(!email.match(emailpattern))
                {
                    alert('please enter valid email');
                    return false;
                }
                let phonep=/^[0-9]{10}$/;
                if(!phone.match(phonep))
                {
                    alert('enter 10 digit phone number');
                    return false;
                }
                if(!password.match(conpassword))
                {
                    alert('password does not match');
                    return false;
                }
                if(password.length<6)
                {
                    alert('password must be atleat 6 characters')
                    return false;
                }
                alert('Registration Succesful')

            }
        </script>
    </head>
    <body>
        
        <center>
        <form name="regForm" onsubmit="return validateform()">
        <h1>Registration Form</h1><br>
        <label>Name: </label>
        <input type="text" name="name" ><br><br>
        <label>Email: </label>
        <input type="text" name="email" ><br><br>
        <label>Phone: </label>
        <input type="text" name="phone" ><br><br>
        <label>Password: </label>
        <input type="password" name="password" ><br><br>
        <label>Confirm Password: </label>
        <input type="password" name="conpassword" ><br><br>
        <button style=" padding:10px;">Submit</button>
    </form>
    
</center>
    </body>

</html>
